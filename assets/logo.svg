    <tspan x="95" dy="1.2em">██║   ██║███████║██║     ███████║██║  ██║██║██████╔╝</tspan>
    <tspan x="95" dy="1.2em">╚██╗ ██╔╝██╔══██║██║     ██╔══██║██║  ██║██║██╔══██╗</tspan>
    <tspan x="95" dy="1.2em"> ╚████╔╝ ██║  ██║███████╗██║  ██║██████╔╝██║██║  ██║</tspan>
    <tspan x="95" dy="1.2em">  ╚═══╝  ╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝╚═════╝ ╚═╝╚═╝  ╚═╝</tspan>
