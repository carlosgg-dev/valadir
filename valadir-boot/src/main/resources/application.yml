server:
  port: 8080

spring:
  application:
    name: valadir
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:postgresql://localhost:5432/valadir
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 2000  # milliseconds: HikariConfig takes a raw long, not a Duration
      data-source-properties:
        # Seconds. A safety net against an unresponsive server, not a query SLA: it applies to every
        # statement on the connection, including the pending-account purge. It lives here and not in
        # the JDBC URL above because the ITs get their URL from the container via @ServiceConnection,
        # so a parameter on the production URL would never reach them.
        socketTimeout: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      # Every Redis operation here is a single key read/write or a short Lua script. Without these,
      # Lettuce waits 60s by default, so the fail-closed policy would take a minute to apply.
      timeout: 2s
      connect-timeout: 1s
  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

notifications:
  mail:
    from: noreply@valadir.local
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 50

auth:
  account-activation:
    otp:
      ttl: 15m
  password-reset:
    otp:
      ttl: 15m
    verification-token:
      ttl: 10m
  lockout:
    window: 1h  # fixed window for counting failed attempts (does not slide on each attempt)
    challenge-threshold: 3  # failures before a CAPTCHA step-up is required; must stay below the first lockout tier
    thresholds:
      - min-failures: 5
        lockout: 60s
      - min-failures: 10
        lockout: 5m
      - min-failures: 15
        lockout: 30m
  captcha:
    enabled: true
    verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
    secret: ${TURNSTILE_SECRET}
    connect-timeout: 2s
    read-timeout: 3s
  jwt:
    private-key: ${JWT_PRIVATE_KEY}
    access-token-ttl: 15m
    refresh-token-ttl: 7d

resilience4j:
  circuitbreaker:
    instances:
      # Same fail-closed answer once Redis is clearly down, without the 2s Lettuce timeout on every request
      redis:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.dao.DataAccessException
      # Same fail-open verdict during a Turnstile outage, without the 2s connect + 3s read on every login
      captcha:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

scheduler:
  pending-activation-account:
    grace-period: 72h
    purge-cron: "0 0 0 * * *"  # once a day at midnight

rate-limit:
  enabled: true
  rules:
    # public endpoints
    # --- login: brute-force + credential stuffing ---
    # IP only: per-account brute-force is handled by the domain login lockout.
    # An EMAIL rule here would run in the filter before the controller and mask
    # the lockout (SEC-005 instead of SEC-006), freezing the attempt counter
    # and making the 10/15 thresholds unreachable.
    - path: /api/auth/login
      strategy: IP
      max-requests: 10
      window: 60s

    # --- register: email enumeration via EMAIL_ALREADY_EXISTS ---
    - path: /api/auth/register
      strategy: IP
      max-requests: 5
      window: 1h
    - path: /api/auth/register
      strategy: EMAIL
      max-requests: 3
      window: 1h

    # --- account-activation: OTP brute-force + account enumeration via INVALID_ACCOUNT_ACTIVATION_OTP ---
    - path: /api/auth/account-activation
      strategy: IP
      max-requests: 10
      window: 60s
    - path: /api/auth/account-activation
      strategy: EMAIL
      max-requests: 5
      window: 15m  # matches OTP TTL — window resets when OTP expires

    # --- account-activation/resend: email spam ---
    - path: /api/auth/account-activation/resend
      strategy: IP
      max-requests: 5
      window: 1h
    - path: /api/auth/account-activation/resend
      strategy: EMAIL
      max-requests: 3
      window: 1h

    # --- password-reset/initiate: account enumeration + OTP spam ---
    - path: /api/auth/password-reset/initiate
      strategy: IP
      max-requests: 5
      window: 1h
    - path: /api/auth/password-reset/initiate
      strategy: EMAIL
      max-requests: 3
      window: 1h

    # --- password-reset/verify: OTP brute-force ---
    - path: /api/auth/password-reset/verify
      strategy: IP
      max-requests: 10
      window: 15m  # matches OTP TTL

    # --- password-reset/complete: reset token abuse ---
    - path: /api/auth/password-reset/complete
      strategy: IP
      max-requests: 5
      window: 15m

    # --- refresh: token replay abuse ---
    - path: /api/auth/refresh
      strategy: IP
      max-requests: 30
      window: 60s

    # --- authenticated endpoints: per-user global limit ---
    - path: /api/**
      strategy: USER
      max-requests: 100
      window: 60s
